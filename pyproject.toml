[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "derafu-support"
version = "1.0.0"
description = "General-purpose Python utilities (dates, dictionaries, numbers and logging)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
  "Babel>=2.18",     # format_number()
]

[dependency-groups]
# Development tools (lint, types and tests):
# `pip install --group dev`
dev = [
  # same versions the projects use, to test the library against them
  "Babel==2.18.0",
  "mypy==2.4.0",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "ruff==0.16.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
derafu_support = ["py.typed"]

[tool.ruff]
include = ["**/*.py", "**/*.pyi"]
exclude = [".git", "__pycache__", "build", "dist", "venv"]
line-length = 79
target-version = "py314"
respect-gitignore = true
fix = false

[tool.ruff.lint]
select = [
  "D",    # pydocstyle: docstrings
  "F",    # Pyflakes: code errors
  "E",    # pycodestyle: style
  "W",    # pycodestyle: warnings
  "I",    # isort: import order
  "UP",   # pyupgrade: modern syntax
  "N",    # pep8-naming: names
  "B",    # bugbear: common bug patterns
  "A",    # flake8-builtins: do not shadow builtins or stdlib names
  "C90",  # mccabe: complexity
  "ANN",  # flake8-annotations: type annotations
  "ARG",  # unused arguments
  "DTZ",  # timezone-aware dates
  "TRY",  # tryceratops: exception handling
  "SLF",  # private member access
  "ERA",  # commented-out code
  "PL",   # pylint
  "PT",   # pytest style
  "SIM",  # simplifications
  "RET",  # returns
  "C4",   # comprehensions
  "PTH",  # pathlib instead of os.path
  "PIE",  # miscellaneous
  "RSE",  # raise
  "PERF", # performance
  "FURB", # refurb: modern idioms
  "PGH",  # pygrep-hooks (forbids blanket ignores)
  "RUF",  # Ruff-specific rules
  "INP",  # flake8-no-pep420: no implicit namespace packages
  "PYI",  # flake8-pyi: type stubs
  # preview rules, enabled one by one (explicit-preview-rules)
  "D421",   # property docstrings do not start with a verb
  "RUF052", # local dummy variables (_name) are not used
]
ignore = [
  # Docstring style: Ruff cannot enforce both rules of each pair.
  # - D203 (blank line before a class docstring) conflicts with
  #   `ruff format`, which removes that line: its opposite, D211, is used.
  # - D212 is dropped in favor of D213 (summary on the second line), the
  #   docstring style of the library.
  "D203",
  "D212",
]

# preview rules only apply when listed by code in `select`
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 25
max-statements = 60

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.14"
strict = true
# methods that override a parent method must use @override
enable_error_code = ["explicit-override"]
files = ["src", "tests"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "build", "dist", "venv"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = "venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
